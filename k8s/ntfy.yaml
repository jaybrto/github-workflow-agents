---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: default
  labels:
    app: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      # Avoid dellmini2 and lenovomini: both have a systemd cgroup v2 incompatibility
      # that causes FailedCreatePodContainer errors (org.freedesktop.systemd1 timeout).
      # Remove this affinity once the host OS on those nodes is upgraded.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - dellmini2
                      - lenovomini
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:latest
          args: ["serve"]
          ports:
            - containerPort: 80
              name: http
          env:
            - name: NTFY_BASE_URL
              value: "https://ntfy.bto.bar"
            - name: NTFY_UPSTREAM_BASE_URL
              value: "https://ntfy.sh"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ntfy
            - name: lib
              mountPath: /var/lib/ntfy
      volumes:
        - name: cache
          emptyDir: {}
        - name: lib
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: default
  labels:
    app: ntfy
spec:
  selector:
    app: ntfy
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: ntfy.bto.bar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
