---
# Deployment for the GWA Webhook Handler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gwa-webhook
  namespace: default
  labels:
    app: github-workflow-agents
    component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-workflow-agents
      component: webhook
  template:
    metadata:
      labels:
        app: github-workflow-agents
        component: webhook
    spec:
      # Exclude nodes with known containerd/cgroup issues that prevent image pulls:
      # - lenovomini: systemd cgroup issue causes ContainerCreating hang
      # - dellmini2: containerd DNS fails to resolve gitea-http.gitea-system.svc.cluster.local
      # - dellmini3: same containerd DNS issue as dellmini2
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - dellmini2
                      - dellmini3
                      - lenovomini
      imagePullSecrets:
        - name: gitea-registry-secret
      containers:
        - name: webhook
          image: registry.bto.bar/jaybrto/gwa-webhook:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: GITHUB_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: gwa-webhook-secrets
                  key: github-app-secret
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gwa-secrets
                  key: github-token
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 10

---
# Service for the GWA Webhook Handler
apiVersion: v1
kind: Service
metadata:
  name: gwa-webhook
  namespace: default
  labels:
    app: github-workflow-agents
    component: webhook
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: github-workflow-agents
    component: webhook

# NOTE: Secrets are not included in this file for security reasons.
# Create them manually before deploying:
#
# kubectl create secret generic gwa-webhook-secrets \
#   --from-literal=github-app-secret="YOUR_GITHUB_APP_SECRET"
#
# kubectl create secret generic cloudflared-bto-services-token \
#   --from-literal=token="YOUR_CLOUDFLARE_TUNNEL_TOKEN"
#
# Get the Cloudflare tunnel token from:
# https://one.dash.cloudflare.com > Networks > Connectors > bto-services-prod > Edit
# Click the copy button next to "cloudflared tunnel run --token ..."

---
# Cloudflared Deployment for bto-services-prod tunnel
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-bto-services
  namespace: default
  labels:
    app: cloudflared
    tunnel: bto-services-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
      tunnel: bto-services-prod
  template:
    metadata:
      labels:
        app: cloudflared
        tunnel: bto-services-prod
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-bto-services-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 5
      restartPolicy: Always
