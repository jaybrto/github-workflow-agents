---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gwa-runner-init
  namespace: default
  labels:
    app: github-workflow-agents
    component: runner
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e

    REPO="${REPO:-}"
    POD_NAME="$(hostname)"
    DB_PATH="${DB_PATH:-/home/runner/.claude/gwa.db}"
    SCHEMA_PATH="${SCHEMA_PATH:-/home/runner/.claude/schema.sql}"

    # SECURITY: Validate REPO format to prevent injection attacks
    # Must be in format: owner/repo with alphanumeric, hyphens, underscores, dots
    if [[ ! "${REPO}" =~ ^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+$ ]]; then
      echo "[GWA] ERROR: Invalid REPO format. Expected 'owner/repo', got: ${REPO}"
      exit 1
    fi

    # SECURITY: Validate POD_NAME format (alphanumeric and hyphens only)
    if [[ ! "${POD_NAME}" =~ ^[a-zA-Z0-9-]+$ ]]; then
      echo "[GWA] ERROR: Invalid POD_NAME format: ${POD_NAME}"
      exit 1
    fi

    echo "[GWA] Starting long-lived pod for repo: ${REPO}"

    # SECURITY: Mark only specific directories as safe for git (no wildcard)
    git config --global --add safe.directory /home/runner/repo
    git config --global --add safe.directory /home/runner/worktrees

    # GitHub CLI uses GITHUB_TOKEN env var automatically
    # Just configure git to use gh for auth
    if [ -n "${GITHUB_TOKEN:-}" ]; then
      gh auth setup-git 2>/dev/null || true
      git config --global credential.helper '!gh auth git-credential'
    fi

    # Clone repo once (main worktree)
    # Check for .git dir since mount point always exists
    if [ ! -d /home/runner/repo/.git ]; then
      echo "[GWA] Cloning repo..."
      # Clear mount point (may have lost+found) and clone
      rm -rf /home/runner/repo/* /home/runner/repo/.[!.]* 2>/dev/null || true
      git clone "https://github.com/${REPO}.git" /home/runner/repo
    else
      echo "[GWA] Repo already cloned, fetching latest..."
      git -C /home/runner/repo fetch --all --prune
    fi

    # Create directories
    mkdir -p /home/runner/worktrees
    mkdir -p /home/runner/.claude/screenshots

    # Initialize SQLite database
    echo "[GWA] Initializing SQLite database..."
    if [ -f "${SCHEMA_PATH}" ] && [ ! -f "${DB_PATH}" ]; then
      echo "[GWA] Creating database from schema..."
      sqlite3 "${DB_PATH}" < "${SCHEMA_PATH}"
    fi

    # Provision environment from orchestrator (credentials, settings, config)
    # Falls back gracefully if orchestrator is unreachable — gwa-provision exits 0 on failure
    echo "[GWA] Provisioning environment from orchestrator..."
    if command -v gwa-provision &> /dev/null; then
      gwa-provision 2>/dev/null || true
    fi

    # Sync Claude config from credentials (run on every start - ~/.config/claude/ is ephemeral)
    # This recreates ~/.config/claude/config.json from the persistent ~/.claude/.credentials.json
    if [ -f "/home/runner/.claude/.credentials.json" ]; then
      echo "[GWA] Syncing Claude config from credentials..."
      node -e "
const fs = require('fs'), path = require('path');
const HOME = '/home/runner';
try {
  const creds = JSON.parse(fs.readFileSync(HOME + '/.claude/.credentials.json', 'utf-8'));
  const token = creds?.claudeAiOauth?.accessToken || creds?.oauthToken;
  if (token) {
    fs.mkdirSync(HOME + '/.config/claude', {recursive:true});
    fs.writeFileSync(HOME + '/.config/claude/config.json', JSON.stringify({oauthToken: token}));
    console.log('[GWA] Synced Claude config from credentials');
  }
} catch(e) { console.warn('[GWA] Config sync failed:', e.message); }
      " 2>/dev/null || true
    fi

    # Run startup recovery for interrupted sessions
    echo "[GWA] Running recovery for interrupted sessions..."
    if command -v gwa-recovery &> /dev/null; then
      gwa-recovery 2>/dev/null || true
    fi

    # Apply pending dependency updates (if no active sessions)
    echo "[GWA] Checking for pending updates..."
    if command -v gwa-check-updates &> /dev/null; then
      gwa-check-updates --apply-pending 2>/dev/null || true
    fi

    # Register pod info in SQLite config
    # SECURITY: Use parameterized approach via printf to prevent SQL injection
    # Values are already validated above, but we still escape single quotes for defense in depth
    SAFE_POD_NAME="${POD_NAME//\'/\'\'}"
    SAFE_REPO="${REPO//\'/\'\'}"
    sqlite3 "${DB_PATH}" "INSERT OR REPLACE INTO config (key, value, updated_at) VALUES ('pod_name', '${SAFE_POD_NAME}', unixepoch())"
    sqlite3 "${DB_PATH}" "INSERT OR REPLACE INTO config (key, value, updated_at) VALUES ('repo', '${SAFE_REPO}', unixepoch())"

    # Initialize tmux session if not running
    if ! tmux has-session -t gwa-work 2>/dev/null; then
      echo "[GWA] Starting tmux session..."

      # Create main session with status window
      tmux new-session -d -s gwa-work -x 200 -y 50 -c /home/runner/repo
      tmux rename-window -t gwa-work:0 "status"

      # Show active sessions from SQLite
      WATCH_CMD="sqlite3 -header -column ${DB_PATH}"
      WATCH_CMD="${WATCH_CMD} 'SELECT id, status, github_number, tmux_window FROM sessions WHERE status IN (\"running\", \"blocked\", \"starting\")'"
      WATCH_CMD="${WATCH_CMD} 2>/dev/null || echo 'Waiting for work...'"
      tmux send-keys -t gwa-work:status \
        "watch -n 5 '${WATCH_CMD}'" Enter
    else
      echo "[GWA] Tmux session already running"
    fi

    echo "[GWA] Pod ready. Keeping alive..."
    exec tail -f /dev/null
