---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gwa-cleanup
  namespace: default
  labels:
    app: github-workflow-agents
    component: cleanup

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gwa-cleanup
  namespace: default
  labels:
    app: github-workflow-agents
    component: cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gwa-cleanup
  namespace: default
  labels:
    app: github-workflow-agents
    component: cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gwa-cleanup
subjects:
  - kind: ServiceAccount
    name: gwa-cleanup
    namespace: default
