---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gwa-credentials-backup
  namespace: default
  labels:
    app: github-workflow-agents
    component: credentials-backup
spec:
  schedule: "0 */6 * * *"   # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: github-workflow-agents
            component: credentials-backup
        spec:
          # Avoid nodes with systemd cgroup issues
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - dellmini2
                          - lenovomini
          serviceAccountName: gwa-cleanup
          restartPolicy: OnFailure
          initContainers:
            - name: fix-permissions
              image: busybox
              command:
                - sh
                - -c
                - chown -R 1001:1001 /home/runner/.claude
              volumeMounts:
                - name: claude-session
                  mountPath: /home/runner/.claude
          containers:
            - name: credentials-backup
              image: registry.bto.bar/jaybrto/github-workflow-agents:latest
              imagePullPolicy: IfNotPresent
              command:
                - gwa-credentials-backup
              env:
                - name: MINIO_ENDPOINT
                  value: "minio.bto.bar:9000"
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gwa-secrets
                      key: minio-access-key
                      optional: true
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gwa-secrets
                      key: minio-secret-key
                      optional: true
                - name: MINIO_BUCKET
                  value: "gwa-recordings"
                - name: DISABLE_METRICS_EXPORT
                  value: "true"
                - name: OTEL_SDK_DISABLED
                  value: "true"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
              volumeMounts:
                - name: claude-session
                  mountPath: /home/runner/.claude
          volumes:
            - name: claude-session
              persistentVolumeClaim:
                claimName: claude-session-gwa-runner-0
          imagePullSecrets:
            - name: gitea-registry-secret
