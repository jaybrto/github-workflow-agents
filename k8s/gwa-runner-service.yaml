---
# Headless service for StatefulSet pod DNS (gwa-runner-0.gwa-runner.default.svc)
apiVersion: v1
kind: Service
metadata:
  name: gwa-runner
  namespace: default
  labels:
    app: github-workflow-agents
    component: runner
spec:
  clusterIP: None
  selector:
    app: github-workflow-agents
  ports:
    - name: ssh
      port: 22
      targetPort: 22
---
# Non-headless ClusterIP service for terminal relay WebSocket
# Reachable via:
#   Cloudflare Tunnel: terminal.bto.bar → bto-services-prod → this service
#   WARP client:       ClusterIP:8080 (via 10.43.0.0/16 routing)
#   Host network:      ClusterIP:8080 or gwa-runner-ws-relay.default.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: gwa-runner-ws-relay
  namespace: default
  labels:
    app: github-workflow-agents
    component: ws-relay
spec:
  type: ClusterIP
  selector:
    app: github-workflow-agents
  ports:
    - name: ws-relay
      port: 8080
      targetPort: 8080
      protocol: TCP
