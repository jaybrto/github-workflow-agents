---
# ClusterSecretStore: connects External Secrets Operator to Vault
# Uses Kubernetes auth (service account token) to authenticate
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: "Secret"
        name: "vault-ca"
        namespace: "default"
        key: "ca.crt"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "gwa-runner"
          serviceAccountRef:
            name: "default"
            namespace: "default"
---
# ExternalSecret: syncs Vault secrets → K8s Secret "gwa-secrets"
# Replaces the manually-created `kubectl create secret generic gwa-secrets`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gwa-secrets
  namespace: default
  labels:
    app: github-workflow-agents
    component: secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gwa-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Existing secrets (migrated from manual K8s secret)
    - secretKey: claude-oauth-token
      remoteRef:
        key: secret/data/gwa
        property: claude-oauth-token
    - secretKey: github-token
      remoteRef:
        key: secret/data/gwa
        property: github-token
    # Claude OAuth account metadata (prevents first-run dialogs)
    - secretKey: oauth-account-uuid
      remoteRef:
        key: secret/data/gwa
        property: oauth-account-uuid
    - secretKey: oauth-email
      remoteRef:
        key: secret/data/gwa
        property: oauth-email
    - secretKey: oauth-org-uuid
      remoteRef:
        key: secret/data/gwa
        property: oauth-org-uuid
    # RabbitMQ connection
    - secretKey: rabbitmq-url
      remoteRef:
        key: secret/data/gwa
        property: rabbitmq-url
    # MinIO for asciicast recording storage
    - secretKey: minio-access-key
      remoteRef:
        key: secret/data/gwa
        property: minio-access-key
    - secretKey: minio-secret-key
      remoteRef:
        key: secret/data/gwa
        property: minio-secret-key
---
# ExternalSecret: syncs Vault secrets → K8s Secret "gwa-webhook-secrets"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gwa-webhook-secrets
  namespace: default
  labels:
    app: github-workflow-agents
    component: secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gwa-webhook-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github-app-secret
      remoteRef:
        key: secret/data/gwa-webhook
        property: github-app-secret
