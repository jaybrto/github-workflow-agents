---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gwa-runner
  namespace: default
  labels:
    app: github-workflow-agents
    component: runner
spec:
  serviceName: gwa-runner
  replicas: 1
  selector:
    matchLabels:
      app: github-workflow-agents
      component: runner
  template:
    metadata:
      labels:
        app: github-workflow-agents
        component: runner
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /home/runner/.claude
              chown -R 1000:1000 /home/runner/worktrees
              chown -R 1000:1000 /home/runner/repo
          volumeMounts:
            - name: claude-session
              mountPath: /home/runner/.claude
            - name: worktrees
              mountPath: /home/runner/worktrees
            - name: repo
              mountPath: /home/runner/repo
      containers:
        - name: gwa-agent
          image: ghcr.io/jaybrto/github-workflow-agents:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "/scripts/entrypoint.sh"]
          ports:
            - name: ws-relay
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "4Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          env:
            # Application config
            - name: REPO
              value: "jaybrto/github-workflow-agents"
            - name: DB_PATH
              value: "/home/runner/.claude/gwa.db"
            - name: SCHEMA_PATH
              value: "/home/runner/.claude/schema.sql"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Secrets
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gwa-secrets
                  key: claude-oauth-token
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gwa-secrets
                  key: github-token
            # Claude OAuth account metadata (prevents first-run dialogs)
            - name: CLAUDE_OAUTH_ACCOUNT_UUID
              valueFrom:
                secretKeyRef:
                  name: gwa-secrets
                  key: oauth-account-uuid
                  optional: true
            - name: CLAUDE_OAUTH_EMAIL
              valueFrom:
                secretKeyRef:
                  name: gwa-secrets
                  key: oauth-email
                  optional: true
            - name: CLAUDE_OAUTH_ORG_UUID
              valueFrom:
                secretKeyRef:
                  name: gwa-secrets
                  key: oauth-org-uuid
                  optional: true
            # OpenTelemetry Configuration
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.alloy.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "github-workflow-agents"
            - name: OTEL_SERVICE_VERSION
              value: "1.0.0"
            - name: DEPLOYMENT_ENVIRONMENT
              value: "production"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,service.namespace=gwa,team=platform"
            # Enable all signals
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            # Fast flush for CLI processes
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: "1000"
            - name: OTEL_BSP_MAX_QUEUE_SIZE
              value: "512"
            - name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE
              value: "256"
            - name: OTEL_BSP_EXPORT_TIMEOUT
              value: "5000"
            # Sampling (100% of traces)
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: claude-session
              mountPath: /home/runner/.claude
            - name: worktrees
              mountPath: /home/runner/worktrees
            - name: repo
              mountPath: /home/runner/repo
            - name: init-script
              mountPath: /scripts/entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
      volumes:
        - name: init-script
          configMap:
            name: gwa-runner-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: claude-session
        labels:
          app: github-workflow-agents
          component: session-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-claude
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: worktrees
        labels:
          app: github-workflow-agents
          component: worktree-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-claude
        resources:
          requests:
            storage: 30Gi
    - metadata:
        name: repo
        labels:
          app: github-workflow-agents
          component: repo-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-claude
        resources:
          requests:
            storage: 10Gi
