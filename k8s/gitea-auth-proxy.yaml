---
# Nginx proxy: routes HTTPS port 443 → Gitea HTTP service port 3000
# Required because Gitea's Docker registry auth realm redirects to
# gitea.k3s.bto.bar (its ROOT_URL) and Kaniko can't skip TLS for
# the auth token endpoint. This proxy uses a self-signed cert that
# Kaniko trusts via SSL_CERT_FILE in an init container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-auth-proxy-config
  namespace: default
data:
  default.conf: |
    server {
      listen 443 ssl;
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;

      resolver 10.43.0.10 valid=30s;

      location / {
        set $upstream http://gitea-http.gitea-system.svc.cluster.local:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        client_max_body_size 0;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-auth-proxy
  namespace: default
  labels:
    app: gitea-auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-auth-proxy
  template:
    metadata:
      labels:
        app: gitea-auth-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 50m
      volumes:
        - name: config
          configMap:
            name: gitea-auth-proxy-config
        - name: tls
          secret:
            secretName: gitea-proxy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-auth-proxy
  namespace: default
  labels:
    app: gitea-auth-proxy
spec:
  type: ClusterIP
  selector:
    app: gitea-auth-proxy
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
