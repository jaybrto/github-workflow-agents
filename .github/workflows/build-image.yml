---
name: Build Container Image

"on":
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "Dockerfile"
      - "schema.sql"
      - "bun.lockb"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jaybrto/github-workflow-agents

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build with Kaniko
        run: |
          # Create Kaniko pod to build and push
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: kaniko-${{ github.run_id }}
            namespace: default
          spec:
            restartPolicy: Never
            containers:
              - name: kaniko
                image: gcr.io/kaniko-project/executor:latest
                args:
                  - "--dockerfile=Dockerfile"
                  - "--context=git://github.com/${{ github.repository }}.git#refs/heads/${{ github.ref_name }}"
                  - "--destination=${{ env.IMAGE }}:latest"
                  - "--destination=${{ env.IMAGE }}:${{ steps.meta.outputs.sha_short }}"
                  - "--destination=${{ env.IMAGE }}:${{ steps.meta.outputs.timestamp }}"
                  - "--cache=true"
                  - "--cache-repo=${{ env.IMAGE }}/cache"
                volumeMounts:
                  - name: docker-config
                    mountPath: /kaniko/.docker
            volumes:
              - name: docker-config
                secret:
                  secretName: ghcr-push-secret
                  items:
                    - key: .dockerconfigjson
                      path: config.json
          EOF

      - name: Wait for build
        run: |
          echo "Waiting for Kaniko build..."
          # Wait for pod to start
          kubectl wait --for=condition=Ready pod/kaniko-${{ github.run_id }} --timeout=120s 2>/dev/null || true
          # Wait for completion (Succeeded or Failed)
          while true; do
            STATUS=$(kubectl get pod kaniko-${{ github.run_id }} -o jsonpath='{.status.phase}')
            echo "Build status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "Build completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "Build failed!"
              kubectl logs kaniko-${{ github.run_id }}
              exit 1
            fi
            sleep 10
          done

      - name: Show build logs
        if: always()
        run: kubectl logs kaniko-${{ github.run_id }} 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: kubectl delete pod kaniko-${{ github.run_id }} --ignore-not-found

      - name: Restart runner pod
        if: success()
        run: |
          echo "Restarting gwa-runner to pick up new image..."
          kubectl rollout restart statefulset/gwa-runner
          kubectl rollout status statefulset/gwa-runner --timeout=300s
