---
name: GWA Project Sync

# Triggers on GitHub Project item column changes
# Requires: PAT with 'project' scope stored as GWA_PROJECT_TOKEN secret
"on":
  workflow_dispatch:
    inputs:
      item_id:
        description: "Project item node ID"
        required: true
      from_column:
        description: "Previous column name"
        required: true
      to_column:
        description: "New column name"
        required: true
      content_type:
        description: "Content type (Issue, PullRequest, DraftIssue)"
        required: false
        default: "Issue"
      content_id:
        description: "Content node ID"
        required: false
      org:
        description: "Organization login"
        required: false
      handler:
        description: "Handler name for the transition"
        required: false
      issue_number:
        description: "Issue/PR number (resolved by webhook)"
        required: false
      issue_title:
        description: "Issue/PR title (resolved by webhook)"
        required: false
      issue_repo:
        description: "Repository (owner/repo) (resolved by webhook)"
        required: false

  # Note: GitHub Projects v2 doesn't emit webhook events for column changes
  # This workflow is triggered by an external listener or scheduled sync
  schedule:
    # Run every 5 minutes to check for column changes
    - cron: "*/5 * * * *"

env:
  POD: gwa-runner-0
  PROJECT_NUMBER: 2
  GWA_BIN: /usr/local/bin

jobs:
  # Job 1: Detect column changes (for scheduled runs)
  detect-changes:
    if: github.event_name == 'schedule'
    runs-on: self-hosted
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
    steps:
      - name: Detect project column changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GWA_PROJECT_TOKEN }}
        run: |
          # Query project items and compare with cached state
          # This is a simplified version - full implementation would use
          # a persistent cache (Redis/SQLite) to track previous states

          OWNER="${{ github.repository_owner }}"

          # Get all project items with their current status
          # Use 'user' instead of 'organization' since jaybrto is a personal account
          ITEMS=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  items(first: 100) {
                    nodes {
                      id
                      fieldValues(first: 10) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                            field { ... on ProjectV2SingleSelectField { name } }
                          }
                        }
                      }
                      content {
                        ... on Issue {
                          number
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f owner="$OWNER" -F number="$PROJECT_NUMBER" 2>/dev/null || echo '{}')

          # For now, output empty changes - full implementation would
          # compare with cached state and emit actual changes
          echo "changes=[]" >> "$GITHUB_OUTPUT"

  # Job 2: Handle column transitions
  handle-transition:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Log transition
        run: |
          echo "Project item transition detected:"
          echo "  Item ID: ${{ github.event.inputs.item_id }}"
          echo "  Content: ${{ github.event.inputs.content_type }} (${{ github.event.inputs.content_id }})"
          echo "  From: ${{ github.event.inputs.from_column }}"
          echo "  To: ${{ github.event.inputs.to_column }}"
          echo "  Handler: ${{ github.event.inputs.handler }}"
          echo "  Org: ${{ github.event.inputs.org }}"
          echo "  Issue: ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          echo "  Title: ${{ github.event.inputs.issue_title }}"

      # ═══════════════════════════════════════════════════════════════════
      # FORWARD FLOW HANDLERS
      # ═══════════════════════════════════════════════════════════════════

      - name: "Handler: start-planning"
        if: github.event.inputs.handler == 'start-planning'
        run: |
          echo "Starting planning phase for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Create session, setup worktree, start Claude REPL with planning prompt
          kubectl exec "$POD" -- "$GWA_BIN/gwa-start-planning" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --item-id "${{ github.event.inputs.item_id }}" \
            --project-number "$PROJECT_NUMBER"

      - name: "Handler: inject-prompt"
        if: github.event.inputs.handler == 'inject-prompt'
        run: |
          echo "Starting implementation for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Plan approved, spawn worker agents for implementation
          kubectl exec "$POD" -- "$GWA_BIN/gwa-architect" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --phase implementation

      - name: "Handler: run-playwright"
        if: github.event.inputs.handler == 'run-playwright'
        env:
          GH_TOKEN: ${{ secrets.GWA_PROJECT_TOKEN }}
        run: |
          echo "Running QA tests for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Run Playwright e2e tests
          kubectl exec "$POD" -- "$GWA_BIN/gwa-run-playwright" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --issue "${{ github.event.inputs.issue_number }}" 2>&1 || true

      - name: "Handler: status-update"
        if: github.event.inputs.handler == 'status-update'
        env:
          GH_TOKEN: ${{ secrets.GWA_PROJECT_TOKEN }}
        run: |
          echo "Ready for review: ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Post summary comment, notify reviewers
          gh issue comment "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --body "QA tests passed. PR moved to Review."

      - name: "Handler: deploy-and-cleanup"
        if: github.event.inputs.handler == 'deploy-and-cleanup'
        run: |
          echo "Deploying and cleaning up ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Merge PR, deploy, destroy session
          kubectl exec "$POD" -- "$GWA_BIN/gwa-cleanup" \
            --session "issue-${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}"

      # ═══════════════════════════════════════════════════════════════════
      # BLOCKED STATE HANDLERS
      # ═══════════════════════════════════════════════════════════════════

      - name: "Handler: pause-for-question"
        if: github.event.inputs.handler == 'pause-for-question'
        env:
          GH_TOKEN: ${{ secrets.GWA_PROJECT_TOKEN }}
        run: |
          echo "Pausing session for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }} - awaiting input"
          # Pause session, post question comment
          kubectl exec "$POD" -- "$GWA_BIN/gwa-architect" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --phase pause

      - name: "Handler: send-answer"
        if: github.event.inputs.handler == 'send-answer'
        run: |
          echo "Resuming ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }} with answer"
          # Resume session with the answer from blocked state
          kubectl exec "$POD" -- "$GWA_BIN/gwa-respond" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}"

      # ═══════════════════════════════════════════════════════════════════
      # ITERATION HANDLERS
      # ═══════════════════════════════════════════════════════════════════

      - name: "Handler: resume-with-failures"
        if: github.event.inputs.handler == 'resume-with-failures'
        run: |
          echo "Resuming implementation with test failures for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Resume session with test failure context
          kubectl exec "$POD" -- "$GWA_BIN/gwa-architect" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --phase fix-failures

      - name: "Handler: request-retest"
        if: github.event.inputs.handler == 'request-retest'
        env:
          GH_TOKEN: ${{ secrets.GWA_PROJECT_TOKEN }}
        run: |
          echo "Re-running tests for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Re-run test suite after review feedback
          kubectl exec "$POD" -- "$GWA_BIN/gwa-run-playwright" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --issue "${{ github.event.inputs.issue_number }}" 2>&1 || true

      # ═══════════════════════════════════════════════════════════════════
      # BACKWARD TRANSITION HANDLERS
      # ═══════════════════════════════════════════════════════════════════

      - name: "Handler: request-replanning"
        if: github.event.inputs.handler == 'request-replanning'
        run: |
          echo "Returning to planning for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Reset session to planning phase
          kubectl exec "$POD" -- "$GWA_BIN/gwa-architect" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --phase replanning

      - name: "Handler: resume-implementation"
        if: github.event.inputs.handler == 'resume-implementation'
        run: |
          echo "Resuming implementation for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Resume existing session for more implementation work
          kubectl exec "$POD" -- "$GWA_BIN/gwa-architect" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --phase resume

      - name: "Handler: cancel-session"
        if: github.event.inputs.handler == 'cancel-session'
        run: |
          echo "Cancelling session for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Cancel and cleanup session without completion
          kubectl exec "$POD" -- "$GWA_BIN/gwa-cleanup" \
            --session "issue-${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --reason cancelled

      # ═══════════════════════════════════════════════════════════════════
      # REOPEN HANDLERS
      # ═══════════════════════════════════════════════════════════════════

      - name: "Handler: reopen-issue"
        if: github.event.inputs.handler == 'reopen-issue'
        run: |
          echo "Reopening ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Create new session for reopened issue
          kubectl exec "$POD" -- "$GWA_BIN/gwa-architect" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --phase "${{ github.event.inputs.to_column == 'Planning' && 'planning' || github.event.inputs.to_column == 'In Progress' && 'implementation' || 'planning' }}"

      # ═══════════════════════════════════════════════════════════════════
      # DIRECT JUMP HANDLERS
      # ═══════════════════════════════════════════════════════════════════

      - name: "Handler: quick-start"
        if: github.event.inputs.handler == 'quick-start'
        run: |
          echo "Quick-starting implementation for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Skip planning, start implementation directly
          kubectl exec "$POD" -- "$GWA_BIN/gwa-architect" \
            --issue "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --phase implementation \
            --skip-planning

      - name: "Handler: close-without-work"
        if: github.event.inputs.handler == 'close-without-work'
        env:
          GH_TOKEN: ${{ secrets.GWA_PROJECT_TOKEN }}
        run: |
          echo "Closing ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }} without work"
          # Close issue without implementation (won't-fix, duplicate, etc.)
          gh issue close "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --comment "Closing without implementation as requested."
          kubectl exec "$POD" -- "$GWA_BIN/gwa-cleanup" \
            --session "issue-${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --reason cancelled 2>&1 || true

      - name: "Handler: skip-qa"
        if: github.event.inputs.handler == 'skip-qa'
        env:
          GH_TOKEN: ${{ secrets.GWA_PROJECT_TOKEN }}
        run: |
          echo "Skipping QA for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Move directly to review without running tests
          gh issue comment "${{ github.event.inputs.issue_number }}" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --body "QA tests skipped. PR moved directly to Review."

      - name: "Handler: skip-implementation"
        if: github.event.inputs.handler == 'skip-implementation'
        env:
          GH_TOKEN: ${{ secrets.GWA_PROJECT_TOKEN }}
        run: |
          echo "Skipping implementation for ${{ github.event.inputs.issue_repo }}#${{ github.event.inputs.issue_number }}"
          # Pre-built solution, skip to QA
          kubectl exec "$POD" -- "$GWA_BIN/gwa-run-playwright" \
            --repo "${{ github.event.inputs.issue_repo }}" \
            --issue "${{ github.event.inputs.issue_number }}" 2>&1 || true

      # ═══════════════════════════════════════════════════════════════════
      # INFRASTRUCTURE HANDLERS
      # ═══════════════════════════════════════════════════════════════════

      - name: "Handler: provision-environment"
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.handler == 'provision-environment'
        run: |
          echo "Starting environment provisioning on $POD"
          kubectl exec "$POD" -- "$GWA_BIN/gwa-provision-environment" \
            --phase start \
            --pod "$POD"
