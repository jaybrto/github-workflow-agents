---
name: GWA Claude Code

"on":
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to work on
        required: true

env:
  POD: gwa-runner-0

jobs:
  claude-work:
    runs-on: self-hosted
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       !contains(github.event.comment.body, '@claude-answer:'))
    timeout-minutes: 1440
    steps:
      - name: Determine PR context
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=${{ github.event.pull_request.number }}" \
              >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.head_ref }}" \
              >> "$GITHUB_OUTPUT"
            echo "trigger=pr_event" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "pr=${{ github.event.issue.number }}" \
              >> "$GITHUB_OUTPUT"
            echo "trigger=comment" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.inputs.pr_number }}" \
              >> "$GITHUB_OUTPUT"
            echo "trigger=manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GWA orchestrator
        run: |
          kubectl exec "$POD" -- gwa-orchestrate \
            --pr "${{ steps.ctx.outputs.pr }}" \
            --repo "${{ github.repository }}" \
            --trigger "${{ steps.ctx.outputs.trigger }}" \
            --branch "${{ steps.ctx.outputs.branch || '' }}" \
            --comment "${{ github.event.comment.body || '' }}" \
            --actor "${{ github.actor }}"
