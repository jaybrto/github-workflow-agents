---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gwa.fullname" . }}-init
  labels:
    {{- include "gwa.runnerLabels" . | nindent 4 }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e

    REPO="{{ include "gwa.fullRepo" . }}"
    POD_NAME="$(hostname)"

    echo "[GWA] Starting long-lived pod for repo: ${REPO}"

    # Mark directories as safe for git
    git config --global --add safe.directory /home/runner/repo
    git config --global --add safe.directory '*'

    # Configure git identity for commits
    git config --global user.email "gwa-bot@users.noreply.github.com"
    git config --global user.name "GWA Bot"

    # GitHub CLI uses GITHUB_TOKEN env var automatically
    # Just configure git to use gh for auth
    if [ -n "${GITHUB_TOKEN:-}" ]; then
      gh auth setup-git 2>/dev/null || true
      git config --global credential.helper '!gh auth git-credential'
    fi

    # Clone repo once (main worktree)
    # Check for .git dir since mount point always exists
    if [ ! -d /home/runner/repo/.git ]; then
      echo "[GWA] Cloning repo..."
      # Clear mount point (may have lost+found) and clone
      rm -rf /home/runner/repo/* /home/runner/repo/.[!.]* 2>/dev/null || true
      git clone "https://github.com/${REPO}.git" /home/runner/repo
    else
      echo "[GWA] Repo already cloned, fetching latest..."
      git -C /home/runner/repo fetch --all --prune
    fi

    # Create worktrees directory
    mkdir -p /home/runner/worktrees

    # Validate Claude authentication environment
    if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
      echo "[GWA] ERROR: Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set"
      echo "[GWA] Claude Code will not be able to authenticate — pods will be stuck on login screen"
    else
      echo "[GWA] Claude auth token present"
    fi

    # Copy Claude credentials if not present (from mounted secret)
    CLAUDE_CONFIG_DIR="/home/runner/.claude"
    CLAUDE_CREDS_SRC="/etc/claude-credentials/credentials.json"
    CLAUDE_CREDS_DST="${CLAUDE_CONFIG_DIR}/.credentials.json"

    if [ -f "${CLAUDE_CREDS_SRC}" ] && [ ! -f "${CLAUDE_CREDS_DST}" ]; then
      echo "[GWA] Copying Claude credentials from secret..."
      mkdir -p "${CLAUDE_CONFIG_DIR}"
      cp "${CLAUDE_CREDS_SRC}" "${CLAUDE_CREDS_DST}"
      chmod 600 "${CLAUDE_CREDS_DST}"
      echo "[GWA] Claude credentials installed"
    elif [ -f "${CLAUDE_CREDS_DST}" ]; then
      echo "[GWA] Claude credentials already present"
    else
      echo "[GWA] WARNING: No Claude credentials found - manual auth required"
    fi

    # Initialize SQLite database if needed
    DB_PATH="${DB_PATH:-/home/runner/gwa.db}"
    SCHEMA_PATH="${SCHEMA_PATH:-/opt/gwa/schema.sql}"

    if [ ! -f "${DB_PATH}" ] || [ ! -s "${DB_PATH}" ]; then
      echo "[GWA] Initializing SQLite database..."
      if [ -f "${SCHEMA_PATH}" ]; then
        sqlite3 "${DB_PATH}" < "${SCHEMA_PATH}"
        echo "[GWA] Database initialized from ${SCHEMA_PATH}"
      else
        echo "[GWA] WARNING: Schema file not found at ${SCHEMA_PATH}"
        echo "[GWA] Database will be initialized on first use"
      fi
    else
      # Check if sessions table exists (basic schema validation)
      if ! sqlite3 "${DB_PATH}" ".tables" 2>/dev/null | grep -q sessions; then
        echo "[GWA] Database exists but missing tables, reinitializing..."
        if [ -f "${SCHEMA_PATH}" ]; then
          sqlite3 "${DB_PATH}" < "${SCHEMA_PATH}"
          echo "[GWA] Database reinitialized from ${SCHEMA_PATH}"
        fi
      else
        echo "[GWA] Database already initialized"
      fi
    fi

    # Initialize tmux session if not running
    if ! tmux has-session -t gwa-work 2>/dev/null; then
      echo "[GWA] Starting tmux session..."

      # Create main session with status window
      tmux new-session -d -s gwa-work -x 200 -y 50 -c /home/runner/repo
      tmux rename-window -t gwa-work:0 "status"

      # Propagate auth env vars into the tmux session so new windows inherit them
      if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
        tmux set-environment -t gwa-work CLAUDE_CODE_OAUTH_TOKEN "${CLAUDE_CODE_OAUTH_TOKEN}"
        echo "[GWA] CLAUDE_CODE_OAUTH_TOKEN pushed to tmux session environment"
      fi
      if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
        tmux set-environment -t gwa-work ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY}"
      fi

      WATCH_CMD="sqlite3 ${DB_PATH} \"SELECT id, status, github_number FROM sessions WHERE status IN ('pending','starting','running','blocked')\" 2>/dev/null || echo 'Waiting for work...'"
      tmux send-keys -t gwa-work:status \
        "watch -n 5 '${WATCH_CMD}'" Enter
    else
      echo "[GWA] Tmux session already running"
      # Refresh auth env vars in existing tmux session (token may have been rotated)
      if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
        tmux set-environment -t gwa-work CLAUDE_CODE_OAUTH_TOKEN "${CLAUDE_CODE_OAUTH_TOKEN}"
      fi
      if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
        tmux set-environment -t gwa-work ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY}"
      fi
    fi

    echo "[GWA] Pod ready. Keeping alive..."
    exec tail -f /dev/null
